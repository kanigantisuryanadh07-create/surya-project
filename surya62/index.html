
<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #ffffff;
            background: #263b80;
            padding: 20px;
            border-radius: 10px;
        }

        .container {
            background: white;
            padding: 20px;
            margin: 20px auto;
            max-width: 1100px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        input {
            padding: 10px;
            margin: 7px;
            width: 200px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            padding: 10px 18px;
            margin: 7px;
            border: none;
            border-radius: 5px;
            color: white;
            background: #263b80;
            cursor: pointer;
        }

        button:hover {
            background: #405bb5;
        }

        .delete {
            background: #dc3545;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #263b80;
            color: white;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }

        h2 {
            color: #263b80;
        }

        #message {
            color: green;
            font-weight: bold;
        }

        .table-wrap {
            overflow-x: auto;
        }
    </style>
</head>

<body>

<h1>STUDENT MANAGEMENT SYSTEM</h1>

<div class="container">

    <h2>Add Student Details</h2>

    <input type="text" id="roll" placeholder="Roll Number">
    <input type="text" id="name" placeholder="Student Name">
    <input type="number" id="age" placeholder="Age">
    <input type="text" id="gender" placeholder="Gender">
    <input type="text" id="course" placeholder="Course">
    <input type="text" id="phone" placeholder="Phone Number">
    <input type="email" id="email" placeholder="Email">

    <h2>Enter Subject Marks</h2>

    <input type="number" id="english" placeholder="English Marks">
    <input type="number" id="maths" placeholder="Maths Marks">
    <input type="number" id="science" placeholder="Science Marks">

    <br>

    <button onclick="addStudent()">Add Student</button>

    <p id="message"></p>

</div>

<div class="container">

    <h2>Search Student</h2>

    <input type="text" id="searchRoll"
           placeholder="Enter Roll Number">

    <button onclick="searchStudent()">Search</button>
    <button onclick="displayStudents()">View All Students</button>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Roll</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Gender</th>
                    <th>Course</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>English</th>
                    <th>Maths</th>
                    <th>Science</th>
                    <th>Total</th>
                    <th>Percentage</th>
                    <th>Grade</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentTable"></tbody>
        </table>
    </div>

</div>

<script>

let students = [
    {
        roll: "101", name: "Rahul Sharma",
        age: 20, gender: "Male", course: "BCA",
        phone: "9876543210", email: "rahul@gmail.com",
        english: 85, maths: 90, science: 95
    },
    {
        roll: "102", name: "Priya Reddy",
        age: 19, gender: "Female", course: "BSc",
        phone: "9876543211", email: "priya@gmail.com",
        english: 80, maths: 85, science: 90
    },
    {
        roll: "103", name: "Arjun Kumar",
        age: 21, gender: "Male", course: "BCom",
        phone: "9876543212", email: "arjun@gmail.com",
        english: 75, maths: 80, science: 85
    },
    {
        roll: "104", name: "Sneha Patel",
        age: 20, gender: "Female", course: "BCA",
        phone: "9876543213", email: "sneha@gmail.com",
        english: 65, maths: 70, science: 75
    },
    {
        roll: "105", name: "Kiran Rao",
        age: 19, gender: "Male", course: "BSc",
        phone: "9876543214", email: "kiran@gmail.com",
        english: 55, maths: 60, science: 65
    }
];

function getGrade(percentage) {

    if (percentage >= 90) return "A+";
    else if (percentage >= 80) return "A";
    else if (percentage >= 70) return "B";
    else if (percentage >= 60) return "C";
    else if (percentage >= 50) return "D";
    else return "F";

}

function addStudent() {

    let roll = document.getElementById("roll").value.trim();
    let name = document.getElementById("name").value.trim();
    let age = Number(document.getElementById("age").value);
    let gender = document.getElementById("gender").value.trim();
    let course = document.getElementById("course").value.trim();
    let phone = document.getElementById("phone").value.trim();
    let email = document.getElementById("email").value.trim();

    let english = Number(document.getElementById("english").value);
    let maths = Number(document.getElementById("maths").value);
    let science = Number(document.getElementById("science").value);

    let marksEntered = ["english", "maths", "science"].every(
        id => document.getElementById(id).value.trim() !== ""
    );

    if (!roll || !name || !age || !gender || !course ||
        !phone || !email || !marksEntered) {
        alert("Please fill all student details!");
        return;
    }

    if (age <= 0) {
        alert("Enter a valid age!");
        return;
    }

    if (students.some(s => s.roll === roll)) {
        alert("Roll Number already exists!");
        return;
    }

    if (![english, maths, science].every(
        m => Number.isFinite(m) && m >= 0 && m <= 100
    )) {
        alert("Marks must be between 0 and 100!");
        return;
    }

    let total = english + maths + science;
    let percentage = total / 3;
    let grade = getGrade(percentage);

    let student = {
        roll, name, age, gender, course,
        phone, email, english, maths, science
    };

    students.push(student);

    document.getElementById("message").innerText =
        "Student added successfully!";

    clearForm();
    displayStudents();

}

function clearForm() { 

    let fields = [
        "roll", "name", "age", "gender", "course",
        "phone", "email", "english", "maths", "science"
    ];

    fields.forEach(id => {
        document.getElementById(id).value = "";
    });

}

function displayStudents(list = students) {

    let table = document.getElementById("studentTable");

    table.innerHTML = "";

    list.forEach(s => {

        let total = s.english + s.maths + s.science;
        let percentage = total / 3;
        let grade = getGrade(percentage);

        let row = `
            <tr>
                <td>${s.roll}</td>
                <td>${s.name}</td>
                <td>${s.age}</td>
                <td>${s.gender}</td>
                <td>${s.course}</td>
                <td>${s.phone}</td>
                <td>${s.email}</td>
                <td>${s.english}</td>
                <td>${s.maths}</td>
                <td>${s.science}</td>
                <td>${total}</td>
                <td>${percentage.toFixed(2)}%</td>
                <td>${grade}</td>
                <td>
                    <button class="delete"
                        onclick="deleteStudent('${s.roll}')">
                        Delete
                    </button>
                </td>
            </tr>
        `;

        table.innerHTML += row;

    });

}

function searchStudent() {

    let roll = document.getElementById("searchRoll").value.trim();

    let student = students.filter(s => s.roll === roll);

    if (student.length === 0) {
        alert("Student not found!");
        return;
    }

    displayStudents(student);

}

function deleteStudent(roll) {

    let confirmDelete = confirm(
        "Are you sure you want to delete this student?"
    );

    if (confirmDelete) {

        students = students.filter(s => s.roll !== roll);

        alert("Student deleted successfully!");

        displayStudents();

    }

}

// Display sample students when page opens
displayStudents();

</script>

</body>
</html>
